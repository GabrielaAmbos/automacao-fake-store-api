name: Execução automação de testes

on:
  workflow_dispatch:
    inputs:
      browser:
        description: 'Selecionar algum destes browsers: chrome / electron'
        required: false
        default: 'chrome'
      amb:
        description: 'Selecionar algum destes ambientes: dev / hlg / prd'
        required: false
        default: 'dev'
      tag:
        description: 'Selecionar alguma tag, por exemplo: @regression / @activities'
        required: false
        default: '@regression'
  pull_request:
    branches: [ main ]


env:
  DEFAULT_BROWSER: "chrome"
  DEFAULT_AMB: "dev"
  DEFAULT_TAG: "@regression"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run ESLint
        run: npm run lint

  test:
    name: Cypress run
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          # @cypress/grep v6 reads its options from --expose (Cypress.env is deprecated in v15)
          command: >-
            npx cypress run
            --config-file config/${{ github.event.inputs.amb || env.DEFAULT_AMB }}.config.js
            --browser ${{ github.event.inputs.browser || env.DEFAULT_BROWSER }}
            --expose grepTags=${{ github.event.inputs.tag || env.DEFAULT_TAG }}
      - name: Upload mochawesome report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mochawesome-report
          path: cypress/report/mochawesome-report
          if-no-files-found: ignore
          retention-days: 20
